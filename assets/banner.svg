<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">VibrationSnap</title>
  <desc id="desc">An offline vibration analysis toolbox. Blue signal traces meet warm paper, representing the two built-in themes.</desc>
